<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achados de Pet</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Lato', sans-serif;
    background: #1a0e00;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 45%, rgba(200, 130, 0, 0.45) 0%, transparent 70%),
      radial-gradient(ellipse 100% 80% at 50% 100%, rgba(60, 30, 0, 0.6) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .top-banner {
    width: 100%;
    text-align: center;
    padding: 14px 20px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,165,0,0.15);
    position: relative;
    z-index: 1;
    letter-spacing: 2px;
    font-size: 13px;
    font-weight: 700;
    color: #ccc;
    animation: fadeDown 0.7s ease both;
  }
  .top-banner span { color: #f5a623; }
  .main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 50px 20px 80px;
    width: 100%;
    max-width: 600px;
    text-align: center;
  }
  .logo-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    animation: floatUp 1s ease both 0.2s;
  }
  .logo-glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,0,0.5) 0%, rgba(255,140,0,0.2) 40%, transparent 70%);
    animation: pulse 3s ease-in-out infinite;
    filter: blur(14px);
  }
  .logo-img {
    position: relative;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 40px rgba(255, 190, 0, 0.55),
      0 0 80px rgba(255, 130, 0, 0.25),
      0 4px 30px rgba(0,0,0,0.5);
    animation: pulse-img 3s ease-in-out infinite;
  }
  .divider-line {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #f5a623, transparent);
    border-radius: 2px;
    margin: 4px auto 28px;
    animation: fadeIn 1s ease both 0.5s;
    opacity: 0;
  }
  .headline {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700;
    color: #fff;
    margin-bottom: 32px;
    line-height: 1.35;
    animation: fadeIn 1s ease both 0.6s;
    opacity: 0;
  }
  .headline .highlight { color: #f5a623; }
  .cta-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1.5px;
    border: none;
    border-radius: 10px;
    padding: 20px 40px;
    width: 100%;
    max-width: 420px;
    cursor: pointer;
    text-decoration: none;
    box-shadow:
      0 4px 30px rgba(37, 211, 102, 0.45),
      0 2px 8px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    animation: fadeIn 1s ease both 0.8s, ctaPop 0.5s ease both 0.8s;
    opacity: 0;
    position: relative;
    overflow: hidden;
  }
  .cta-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: shimmer 2.5s ease-in-out infinite 2s;
  }
  .cta-btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 40px rgba(37, 211, 102, 0.55), 0 4px 12px rgba(0,0,0,0.3);
    filter: brightness(1.05);
  }
  .cta-btn:active { transform: scale(0.98); }
  .whatsapp-icon { width: 26px; height: 26px; fill: #fff; flex-shrink: 0; }
  .member-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 14px;
    color: #ccc;
    animation: fadeIn 1s ease both 1s;
    opacity: 0;
    backdrop-filter: blur(4px);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #25d366;
    animation: blink 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }
  .subtext {
    margin-top: 22px;
    color: rgba(255,255,255,0.55);
    font-size: 15px;
    font-weight: 300;
    animation: fadeIn 1s ease both 1.1s;
    opacity: 0;
  }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);} }
  @keyframes floatUp  { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);} }
  @keyframes fadeIn   { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
  @keyframes ctaPop   { 0%{transform:scale(0.95);}60%{transform:scale(1.02);}100%{transform:scale(1);} }
  @keyframes pulse    { 0%,100%{opacity:.8;transform:scale(1);}50%{opacity:1;transform:scale(1.08);} }
  @keyframes pulse-img{ 0%,100%{box-shadow:0 0 40px rgba(255,190,0,.55),0 0 80px rgba(255,130,0,.25),0 4px 30px rgba(0,0,0,.5);}50%{box-shadow:0 0 60px rgba(255,200,0,.7),0 0 100px rgba(255,150,0,.35),0 4px 30px rgba(0,0,0,.5);} }
  @keyframes blink    { 0%,100%{opacity:1;}50%{opacity:.3;} }
  @keyframes shimmer  { from{left:-100%;}to{left:200%;} }
</style>
</head>
